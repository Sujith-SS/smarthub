<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Addresses</title>
    <link rel="stylesheet" href="https://allyoucan.cloud/cdn/icofont/1.0.1/icofont.css" integrity="sha384-jbCTJB16Q17718YM9U22iJkhuGbS0Gd2LjaWb4YJEZToOPmnKDjySVa323U+W7Fv" crossorigin="anonymous">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h4 {
            color: #ff6b00;
        }
        .btn-primary {
            background-color: #ff6b00;
            border-color: #ff6b00;
        }
        .btn-primary:hover {
            background-color: #e65c00;
            border-color: #e65c00;
        }
        .addresses-item {
            background-color: #ffffff;
            border: 1px solid #ff6b00 !important;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .addresses-item i {
            color: #ff6b00;
        }
        .addresses-item h6 {
            color: #ff6b00;
        }
        .addresses-item p {
            color: #333;
        }
        .modal-content {
            border-radius: 8px;
        }
        .modal-header {
            background-color: #ff6b00;
            color: #ffffff;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
        .modal-header .close {
            color: #ffffff;
        }
        .form-control:focus {
            border-color: #ff6b00;
            box-shadow: 0 0 0 0.2rem rgba(255,107,0,.25);
        }
        .custom-radio .custom-control-input:checked ~ .custom-control-label::before {
            background-color: #ff6b00;
            border-color: #ff6b00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h4 class="font-weight-bold mb-4">Manage Addresses</h4>
        <button class="btn btn-primary mb-4" data-toggle="modal" data-target="#add-address-modal">Add Address</button>
        <div class="row" id="addresses-container">
            {% for address in addresses %}
                <div class="col-md-6">
                    <div class="addresses-item">
                        <div class="custom-control custom-radio">
                            <input type="radio" id="address{{ address.id }}" name="addressRadio" class="custom-control-input" {% if address.is_default %}checked{% endif %}>
                            <label class="custom-control-label" for="address{{ address.id }}">
                                <div class="media">
                                    <div class="mr-3"><i class="icofont-ui-home icofont-3x"></i></div>
                                    <div class="media-body">
                                        <h6 class="mb-1">{{ address.label }}</h6>
                                        <p>{{ address.address_line1 }}, {{ address.address_line2 }}<br>{{ address.city }}, {{ address.state }} {{ address.zip_code }}</p>
                                        <p class="mb-0 font-weight-bold">
                                            <a class="text-primary mr-3" data-toggle="modal" data-target="#edit-address-modal" data-address-id="{{ address.id }}"><i class="icofont-ui-edit"></i> EDIT</a>
                                            <a class="text-danger" data-toggle="modal" data-target="#delete-address-modal" data-address-id="{{ address.id }}"><i class="icofont-ui-delete"></i> DELETE</a>
                                        </p>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>

        <!-- Add Address Modal -->
        <div class="modal fade" id="add-address-modal" tabindex="-1" role="dialog" aria-labelledby="addAddressModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addAddressModalLabel">Add Address</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form id="add-address-form">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-primary">Save Address</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Address Modal -->
        <div class="modal fade" id="edit-address-modal" tabindex="-1" role="dialog" aria-labelledby="editAddressModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editAddressModalLabel">Edit Address</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form id="edit-address-form">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete Address Modal -->
        <div class="modal fade" id="delete-address-modal" tabindex="-1" role="dialog" aria-labelledby="deleteAddressModalLabel" aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteAddressModalLabel">Delete Address</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        Are you sure you want to delete this address?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger" id="confirm-delete-address">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script>
        // Function to create a new address item
        function createAddressItem(label, address, id) {
            return `
                <div class="col-md-6">
                    <div class="addresses-item">
                        <div class="custom-control custom-radio">
                            <input type="radio" id="${id}" name="addressRadio" class="custom-control-input">
                            <label class="custom-control-label" for="${id}">
                                <div class="media">
                                    <div class="mr-3"><i class="icofont-ui-home icofont-3x"></i></div>
                                    <div class="media-body">
                                        <h6 class="mb-1">${label}</h6>
                                        <p>${address}</p>
                                        <p class="mb-0 font-weight-bold">
                                            <a class="text-primary mr-3" data-toggle="modal" data-target="#edit-address-modal" href="#"><i class="icofont-ui-edit"></i> EDIT</a>
                                            <a class="text-danger" data-toggle="modal" data-target="#delete-address-modal" href="#"><i class="icofont-ui-delete"></i> DELETE</a>
                                        </p>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>
            `;
        }

        // Handle form submission
        $('#add-address-form').submit(function(e) {
            e.preventDefault();
            const label = $('#inputLabel').val();
            const address = $('#inputAddressLine1').val() + ', ' + $('#inputCity').val() + ', ' + $('#inputState').val() + ' ' + $('#inputZip').val();
            const id = 'address' + ($('input[name="addressRadio"]').length + 1);
            
            $('#addresses-container').append(createAddressItem(label, address, id));
            $('#add-address-modal').modal('hide');
            this.reset();
        });




        
    </script>
</body>
</html>
